"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 500
format = '''
[╭╴](bold black)$all$fill$status$cmd_duration$time[╶╮](bold black)
[╰─](bold black)$character
'''
right_format = '''
[◀─╯](bold black)
'''

[character]
success_symbol = "[▶](bold green)"
error_symbol = "[▶](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " "

[cmd_duration]
min_time = 2000
format = '[\[$duration\]]($style) '

[time]
disabled = false
format = '[$time]($style)'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[aws]
disabled = true

[line_break]
disabled = true

[username]
show_always = true

[fill]
symbol = " "

[package]
disabled = true

[status]
disabled = false
symbol = '\(╯°Д°\)╯︵ ┻━┻'
format = '[$symbol]($style) '
